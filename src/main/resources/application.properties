spring.application.name=preguntale-a-tus-datos

# --- Credenciales ---
# La clave de Gemini y la contraseña de MySQL NO van aquí. Se leen de variables de entorno
# (GEMINI_API_KEY, DB_PASSWORD) o del archivo application-local.properties, que está en .gitignore.
spring.config.import=optional:classpath:application-local.properties

# --- Base de datos (MySQL) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/preguntale_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&rewriteBatchedStatements=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Datos simulados del supermercado ---
# Si la base está vacía, al arrancar se generan productos, ventas, inventario y lotes.
datos.generar=true
# Si la última venta es de un día anterior a hoy, borra y vuelve a simular para que "hoy" tenga ventas.
datos.regenerar-si-desactualizados=true
datos.dias-historial=90
datos.semilla=2026
app.zona-horaria=America/Bogota

# --- IA (Gemini, nivel gratuito) ---
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=gemini-3.5-flash
spring.ai.google.genai.chat.temperature=0.2
# Gemini 3 razona en nivel HIGH por defecto, lo que hace lento el chat. Para elegir herramientas
# y fechas basta con LOW. Opciones: MINIMAL, LOW, MEDIUM, HIGH.
spring.ai.google.genai.chat.thinking-level=LOW

# --- Memoria de conversación (WhatsApp) ---
# Cuántos mensajes recientes de cada número recuerda el asistente
asistente.memoria.mensajes=10

# --- WhatsApp Cloud API (Meta) ---
# Apagado por defecto. Para activarlo, pon en application-local.properties (está en .gitignore):
#   whatsapp.habilitado=true
#   whatsapp.token-verificacion=...   (texto que inventas y pegas en Meta al registrar el webhook)
#   whatsapp.app-secret=...           (App settings > Basic > App secret)
#   whatsapp.token-acceso=...         (WhatsApp > API Setup > token de acceso)
#   whatsapp.id-numero-telefono=...   (WhatsApp > API Setup > Phone number ID)
#   whatsapp.numeros-autorizados=573001234567,573009876543
whatsapp.habilitado=false
whatsapp.version-graph=v23.0
whatsapp.maximo-caracteres-por-mensaje=3500

# --- Registro ---
# Los mensajes de la aplicación también se guardan en logs/app.log (ignorado por git)
logging.file.name=logs/app.log

# --- Reintentos ---
# Si Gemini falla, reintenta pocas veces para no dejar al usuario esperando minutos
spring.ai.retry.max-attempts=2
